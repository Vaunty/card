<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matthew Ngoy</title>
  <meta name="description" content="Matthew Ngoy — LinkedIn and resumes." />
  <meta name="theme-color" content="#0a0a0a" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .rise { animation: rise 0.5s ease-out both; }
    .glow { background: radial-gradient(circle at 50% 0%, rgb(52 211 153 / 0.08), transparent 55%); }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
  </style>
</head>
<body class="relative min-h-dvh bg-neutral-950 text-neutral-100 antialiased flex items-center justify-center p-6">
  <div class="glow pointer-events-none fixed inset-0" aria-hidden="true"></div>

  <main class="relative w-full max-w-sm">
    <header class="rise text-center mb-8">
      <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-neutral-900 text-lg font-medium tracking-wide text-emerald-400 ring-1 ring-emerald-400/25">MN</div>
      <h1 class="text-2xl font-semibold tracking-tight">Matthew Ngoy</h1>
      <p class="mt-1 text-sm text-neutral-400">Computer Science, Cybersecurity · Kean University</p>
      <p id="tags" class="mt-3 font-mono text-[11px] tracking-wide text-neutral-500"></p>
    </header>

    <nav id="links" class="space-y-3" aria-label="Links"></nav>

    <footer class="rise mt-8 flex justify-center gap-5 text-xs text-neutral-500" style="animation-delay: 0.4s">
      <a class="transition-colors hover:text-emerald-400" href="mailto:ngoym@kean.edu">ngoym@kean.edu</a>
      <a class="transition-colors hover:text-emerald-400" href="https://github.com/Vaunty" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </main>

  <script>
    // Edit these lists to change what the page says and links to.
    const LINKS = [
      { label: "LinkedIn", note: "Connect with me", href: "https://www.linkedin.com/in/matthewngoy", primary: true },
      { label: "Resume — Industry", note: "PDF", href: "resumes/Matthew_Ngoy_Resume_Industry.pdf" },
      { label: "Resume — Research", note: "PDF", href: "resumes/Matthew_Ngoy_Resume_Research.pdf" },
    ];
    const TAGS = ["red teaming", "AI safety", "IoT"];

    const arrow = '<svg class="h-4 w-4 opacity-40 transition group-hover:translate-x-0.5 group-hover:opacity-100" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>';

    const base = "rise group flex items-center justify-between rounded-2xl px-5 py-4 transition active:scale-[0.98]";
    const primary = "bg-white text-neutral-900 hover:bg-neutral-200";
    const secondary = "border border-neutral-800 bg-neutral-900 hover:border-emerald-400/40";

    document.getElementById("tags").textContent = TAGS.join("  ·  ");

    document.getElementById("links").innerHTML = LINKS.map((l, i) => `
      <a href="${l.href}" target="_blank" rel="noopener" class="${base} ${l.primary ? primary : secondary}" style="animation-delay: ${0.1 * (i + 1)}s">
        <span>
          <span class="block text-sm font-medium">${l.label}</span>
          <span class="block text-xs opacity-60">${l.note}</span>
        </span>
        ${arrow}
      </a>`).join("");
  </script>
</body>
</html>
